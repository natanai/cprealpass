name: Biology CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biology-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Offline models, contracts, and safe source artifact
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show revision
        shell: pwsh
        run: |
          Write-Host "Revision: $env:GITHUB_SHA"
          Write-Host "Ref: $env:GITHUB_REF"
          pwsh --version

      - name: Run cloud-safe Biology checks
        shell: pwsh
        run: ./tests/Run-CI.ps1

      - name: Build redistribution-safe Biology development source package
        shell: pwsh
        run: ./tools/Build-Package.ps1

      - name: Reject forbidden or blocked artifact content
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath ./dist -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one development source package, found $($archives.Count)." }
          $scanRoot = Join-Path $env:RUNNER_TEMP 'biology-artifact-scan'
          if (Test-Path -LiteralPath $scanRoot) { Remove-Item -LiteralPath $scanRoot -Recurse -Force }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $scanRoot
          ./tools/Test-ArtifactPolicy.ps1 -Root $scanRoot

      - name: Upload Biology development source package
        uses: actions/upload-artifact@v4
        with:
          name: biology-development-source-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload offline test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biology-offline-reports-${{ github.sha }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 14
