name: Biology CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biology-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Offline models, contracts, and safe source artifact
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show revision
        shell: pwsh
        run: |
          Write-Host "Revision: $env:GITHUB_SHA"
          Write-Host "Ref: $env:GITHUB_REF"
          pwsh --version

      - name: W13 fingerprint official cybercmd standalone asset
        shell: pwsh
        run: |
          $url = 'https://github.com/jac3km4/cybercmd/releases/download/v0.0.13/cybercmd-standalone.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'cybercmd-standalone-v0.0.13.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToUpperInvariant()
          Write-Host "W13_CYBERCMD_STANDALONE_SHA256=$hash"
          Write-Host "W13_CYBERCMD_STANDALONE_BYTES=$((Get-Item -LiteralPath $archive).Length)"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            foreach ($entry in @($zip.Entries | Sort-Object FullName)) {
              Write-Host ("W13_CYBERCMD_ENTRY=" + $entry.FullName + "|" + $entry.Length)
            }
          } finally { $zip.Dispose() }

      - name: Run cloud-safe Biology checks
        shell: pwsh
        run: ./tests/Run-CI.ps1

      - name: Build inspectable Biology player uninstaller
        shell: pwsh
        run: ./tools/Build-BiologyUninstaller.ps1 -OutputPath './dist/Uninstall Biology.exe'

      - name: Build redistribution-safe Biology development source package
        shell: pwsh
        run: ./tools/Build-Package.ps1

      - name: Reject forbidden or blocked artifact content
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath ./dist -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one development source package, found $($archives.Count)." }
          $scanRoot = Join-Path $env:RUNNER_TEMP 'biology-artifact-scan'
          if (Test-Path -LiteralPath $scanRoot) { Remove-Item -LiteralPath $scanRoot -Recurse -Force }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $scanRoot
          ./tools/Test-ArtifactPolicy.ps1 -Root $scanRoot

      - name: Upload Biology player uninstaller
        uses: actions/upload-artifact@v4
        with:
          name: biology-player-uninstaller-${{ github.sha }}
          path: dist/Uninstall Biology.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Biology development source package
        uses: actions/upload-artifact@v4
        with:
          name: biology-development-source-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload offline test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biology-offline-reports-${{ github.sha }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 14
