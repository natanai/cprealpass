name: realpass CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    name: Offline models, contracts, and safe package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show revision
        shell: pwsh
        run: |
          Write-Host "Revision: $env:GITHUB_SHA"
          Write-Host "Ref: $env:GITHUB_REF"
          pwsh --version

      - name: Run cloud-safe realpass checks
        shell: pwsh
        run: ./tests/Run-CI.ps1

      - name: Build redistribution-safe development source package
        shell: pwsh
        run: ./tools/Build-Package.ps1

      - name: Upload development source package
        uses: actions/upload-artifact@v4
        with:
          name: realpass-development-source-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload offline test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realpass-offline-reports-${{ github.sha }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 14
